    <script>
      if ('serviceWorker' in navigator && ['localhost', '127.0.0.1'].includes(window.location.hostname)) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister())
        })
        if ('caches' in window) {
          caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)))
        }
      }
    </script>
    <script type="module">
      if (['5173', '5174', '5175'].includes(window.location.port) && !window.__vite_plugin_react_preamble_installed__) {
        import('/' + '@react-refresh').then((RefreshRuntime) => {
          RefreshRuntime.default.injectIntoGlobalHook(window)
          window.$RefreshReg$ = () => {}
          window.$RefreshSig$ = () => (type) => type
          window.__vite_plugin_react_preamble_installed__ = true
        })
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
